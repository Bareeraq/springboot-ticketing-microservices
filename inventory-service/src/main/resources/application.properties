spring.application.name=inventoryservice
server.port=8080
debug=true

#MySql DB Config
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/ticketing
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
keycloak.auth.jwt-set-uri=http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8091}/realms/master/protocol/openid-connect/certs

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

#OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs